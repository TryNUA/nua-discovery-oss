[project]
name = "nua-discovery"
version = "0.1.0"
description = "A knowledge base of your customer discovery calls: transcripts in, verified findings, tracked beliefs and Slack briefs out"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1.0",
  "slack_sdk>=3.30",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "google-cloud-tasks>=2.16",
  "google-auth>=2.30",
  "PyJWT[crypto]>=2.8",
  "fastmcp>=4.0.10,<5",
  "python-dotenv>=1.0",
  "pydantic>=2.13,<3",
  "ruamel-yaml>=0.18",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nua = "nua.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nua", "service"]
# The setup page `nua setup` serves, prebuilt from setup-ui/ (see setup-ui/README.md), so no Node is needed.
artifacts = ["nua/setup/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
