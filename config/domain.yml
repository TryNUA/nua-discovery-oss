# What your discovery is about. Every prompt reads this file, so the pipeline works for any market.
# Fill in the first three with `uv run python -m nua init`, or by hand. For filled-in examples see
# examples/insurance/ and examples/freight-brokerage/. Keep each value plain and specific: the models
# read it as the brief for every call.

# Your company, as the models should name it ("<company> people are the interviewers").
company: ""

# Who you sell to, in a few words, e.g. "independent dental practices".
market: ""

# The problems or questions you want your calls to answer. Findings are judged against these.
exploring: ""

# Optional from here on: anything left empty falls back to a neutral default in nua/config.py.

# Each finding is scoped so it is never stretched beyond what was said. Describe the three scope
# fields for your market (the fourth, seat, is the person's role). The keys stay the same.
scope:
  # the product line, workflow or use case a finding is about, with a few examples
  line: ""
  # the kind of organization a finding is about, with a few examples
  party: ""
  # the market segment: company size, region or tier, with a few examples
  segment: ""

# Where the main person on a call stands relative to what you are building (role_in_thesis), as
# "id: description". Ids are short lowercase words; keep "expert" and "competitor". Empty means the
# defaults in nua/config.py: customer, intermediary, vendor, expert, competitor.
roles: {}

# Examples of the short institution label each call gets (institution_type), e.g.
# "independent practice, dental service organization, dental supply distributor".
institution_examples: ""

# The Slack app's display name, as people @mention it. Empty means "Nua Discovery".
bot_name: ""
