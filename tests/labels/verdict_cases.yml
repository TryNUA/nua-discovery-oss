# C-001: is video the most valuable evidence on a claim? (B-001)
- conflict: C-001
  fixture: darius-kemp
  target: B-001
  expected: supports
  quote: "Honestly video is the single best thing you can have on a liability file."
- conflict: C-001
  fixture: lena-okafor
  target: B-001
  expected: supports
  quote: "Having the dashcam clip makes a huge difference, so we ask for it on basically every liability claim."
- conflict: C-001
  fixture: viktor-lang
  target: B-001
  expected: contradicts
  accept: [scope_mismatch]
  quote: "Honestly, in my line of work, video almost never makes a difference."
- conflict: C-001
  fixture: wade-pruitt
  target: B-001
  expected: contradicts
  accept: [scope_mismatch]
  quote: "On the yard and warehouse stuff, the workers' comp, the slip and fall stuff, hardly ever."

