        attribution: inferred
      - quote: "For the adjusting part, like I told you, it's of very limited use."
        speaker: Viktor Lang
        attribution: inferred
    scope: {line: commercial property, party: carrier, seat: independent adjuster / TPA}

  - text: "Burglary is the only claim type where video comes up."
