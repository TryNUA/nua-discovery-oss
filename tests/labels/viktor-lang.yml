  firm: Corrigan Hale
  seat: independent adjuster / TPA
  institution_type: independent adjusting firm
  role_in_thesis: intermediary

summary:
  - "An independent adjuster on commercial property claims (water, wind, fire, burglary) says video seldom matters to his work."
  - "He sees the damage on site and can date a leak from the staining; burglary footage confirms a loss he does not dispute."
  - "Clips are short but arrive as clunky files through shared drives and corporate IT, and carriers still want them in the file."
  - "Inspection is part of what the carrier owes, and an inspector's expertise catches what a camera misses."
  - "His real pain is long templated reports; he uses Copilot and ChatGPT for policy details and they sometimes make them up."

findings:
