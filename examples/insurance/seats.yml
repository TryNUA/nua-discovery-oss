# Example config/seats.yml for P&C insurance (examples/insurance/).
# Seat list: the role someone speaks from on a call. The line of business (workers' comp, commercial
# auto, cyber...) goes in the claim scope, not the seat.

# Underwriting
- underwriter
- underwriting operations / submission intake
- insurance product / platform owner

# Actuarial and data
- pricing actuary
- reserving actuary
- actuarial consultant / data scientist

# Risk
- risk engineering / loss control
- risk manager (insured)
- fleet safety / telematics

# Claims
- claims adjuster (staff)
- independent adjuster / TPA
- claims manager / supervisor
- claims executive
- SIU / fraud investigator

# Distribution and capacity
- broker / agent
- MGA / insurtech founder
- captive / alternative risk
- reinsurance

# Any
- former executive / advisor
- other
