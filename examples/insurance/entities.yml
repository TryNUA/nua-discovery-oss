  aliases:
    - {
        alias: Carrigan Hail,
        confidence: high,
        source: 'viktor-lang fixture: "because I work for a big firm, it''s called, uh, Carrigan Hail"',
      }
CompScience:
  aliases:
    - {
        alias: comp science,
        confidence: medium,
        source: 'wade-pruitt fixture: "We also talked to comp science about a camera pilot at one yard"',
      }
