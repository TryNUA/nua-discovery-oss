# Seats: the job role someone speaks from on a call, such as "head of finance" or "claims manager".
# Evidence for each belief is counted by seat. This file is optional: the list grows itself. On every
# call the extractor sees these seats plus every seat already on a digested call, reuses one when the
# role matches and otherwise writes a new short generic role (lowercase, no firm or person names).
# Seed it to steer the names from day one, one "- seat" line each, e.g.
#   - head of operations
#   - other
# Seats listed here are also the ones open-questions.md reports as "not yet heard from".
# To merge two seats later: add the one to keep here, and correct past calls in config/overrides.yml
# (`<call id>: {seat: head of operations}`), then run `nua reindex`.
# See examples/insurance/seats.yml and examples/freight-brokerage/seats.yml.
[]
